apiVersion: apps/v1
kind: Deployment

metadata:
  name: shopping-backend
  namespace: shopping

spec:
  replicas: 2

  selector:
    matchLabels:
      app: shopping-backend

  template:
    metadata:
      labels:
        app: shopping-backend

    spec:
      containers:
        - name: backend
          image: YOUR_ECR_BACKEND_IMAGE
          ports:
            - containerPort: 5000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"