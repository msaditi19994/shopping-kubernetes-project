apiVersion: apps/v1
kind: Deployment

metadata:
  name: shopping-frontend
  namespace: shopping

spec:
  replicas: 2

  selector:
    matchLabels:
      app: shopping-frontend

  template:
    metadata:
      labels:
        app: shopping-frontend

    spec:
      containers:
        - name: frontend
          image: YOUR_ECR_FRONTEND_IMAGE
          ports:
            - containerPort: 80