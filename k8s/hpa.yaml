apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: shopping-backend-hpa
  namespace: shopping

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shopping-backend

  minReplicas: 2
  maxReplicas: 10

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70